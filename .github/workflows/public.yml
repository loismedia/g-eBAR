name: g-eBAR public

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, loispg]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      hid_version: ${{ steps.metadata.outputs.hid_version }}
      build_time: ${{ steps.verify.outputs.build_time }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a major.minor.patch version.'
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo 'The release tag must match Directory.Build.props.'
            exit 1
          fi
          suffix="${GITHUB_SHA:0:5}"
          hid_version="$(TZ='Europe/Moscow' date '+%d.%m')-hid-${suffix^^}"
          printf 'version=%s\nhid_version=%s\n' "$version" "$hid_version" >> "$GITHUB_OUTPUT"
      - name: Lint Dockerfile
        shell: bash
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0 hadolint --failure-threshold error - < Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: loispg-gebar-public
          driver: docker-container
          keep-state: true
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              reservedSpace = "2GB"
              maxUsedSpace = "12GB"
              minFreeSpace = "10GB"
      - name: Build Windows artifacts in Linux container
        uses: docker/build-push-action@v7
        with:
          context: .
          target: artifact
          build-args: |
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            APP_VERSION=v${{ steps.metadata.outputs.version }}
            NIGHTLY=false
            PUBLISH_HID=true
            HID_VERSION=${{ steps.metadata.outputs.hid_version }}
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=local,dest=./artifacts/g-eBAR-win-x64
      - name: Verify artifacts
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/g-eBAR-win-x64/g-eBAR.exe
          test -s artifacts/g-eBAR-win-x64/g-eHID.exe
          cd artifacts/g-eBAR-win-x64
          sha256sum g-eBAR.exe g-eHID.exe > SHA256SUMS.txt
          printf 'build_time=%s\n' "$(TZ='Europe/Moscow' date '+%Y-%m-%d %H:%M:%S UTC+3')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: g-eBAR-win-x64
          path: |
            artifacts/g-eBAR-win-x64/*.exe
            artifacts/g-eBAR-win-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, loispg]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: g-eBAR-win-x64
          path: artifacts/release
      - name: Check release does not already exist
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG
              });
              core.setFailed('A release with this tag already exists. Publish a new version instead.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Prepare versioned release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: g-eBAR v${{ needs.build.outputs.version }}
          body: |
            g-eHID: ${{ needs.build.outputs.hid_version }}

            Built: ${{ needs.build.outputs.build_time }}
          files: |
            artifacts/release/g-eBAR.exe
            artifacts/release/g-eHID.exe
            artifacts/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
          draft: true
      - name: Publish versioned release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true'
            });
